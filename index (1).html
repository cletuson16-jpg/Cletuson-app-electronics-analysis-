<script>(function(){
  function showOffline(){
    const g=document.getElementById('offlineGate');
    if(g)g.classList.add('show');
    const L=document.getElementById('loader');
    if(L){L.classList.add('hide');setTimeout(()=>L.remove(),400)}
  }
  function hideOffline(){
    const g=document.getElementById('offlineGate');
    if(g)g.classList.remove('show');
  }
  function boot(){
    const L=document.getElementById('loader');
    if(L){L.classList.add('hide');setTimeout(()=>L.remove(),500)}
  }
  function checkNet(){
    if(!navigator.onLine){showOffline();return false}
    hideOffline();
    return true;
  }
  window.addEventListener('offline',showOffline);
  window.addEventListener('online',()=>{hideOffline();if(typeof acct!=='undefined'&&acct&&typeof locked!=='undefined'&&!locked&&typeof mainView==='function')mainView();else if(typeof authView==='function')authView()});
  // require online before starting
  setTimeout(function(){
    if(!checkNet())return;
    boot();
  },1200);
})()</script>

/* ---------- DATA: [name,category,package,rating,pinout,faults/test,replacements] ---------- */
const D=[
['IRF3205','MOSFET','TO-220','N-channel 55V 110A (package limit about 98A), Rds(on) 8 mΩ','Front view, left to right: 1 Gate, 2 Drain, 3 Source','Most common fault is shorted drain-source. Meter in diode mode: no reading between D and S either way. Also check gate resistors and gate zener.','IRF1010N, IRFB3207, IRFZ48N (lower current), STP75NF75'],
['IRFZ44N','MOSFET','TO-220','N-channel 55V 49A','1 Gate, 2 Drain, 3 Source','Shorted D-S when overloaded. Always change all MOSFETs on that side together.','IRFZ46N, IRFZ48N, IRF3205, STP55NF06'],
['IRF540N','MOSFET','TO-220','N-channel 100V 33A','1 Gate, 2 Drain, 3 Source','Shorted D-S. Weak gate drive makes it run hot.','IRF3710 (57A), IRFB4110, IRF540'],
['IRFB4110','MOSFET','TO-220','N-channel 100V 180A, very low Rds(on)','1 Gate, 2 Drain, 3 Source','Check for D-S short and burnt gate resistor.','IRFB4115 (150V), IRFP4110 (TO-247 case)'],
['IRF740','MOSFET','TO-220','N-channel 400V 10A','1 Gate, 2 Drain, 3 Source','Common in high-voltage DC-AC stages. Test D-S short and gate leakage.','IRF840 (500V 8A), FQP10N60, STP10NK60Z'],
['IRFP250N','MOSFET','TO-247','N-channel 200V 30A','1 Gate, 2 Drain, 3 Source','Shorted D-S in H-bridge stages.','IRFP260N, IRFP4227'],
['IRF9540','MOSFET','TO-220','P-channel 100V 23A','1 Gate, 2 Drain, 3 Source','Shorted D-S. Replace the P and N pair together if both look stressed.','IRF9540N, IRF5210 (100V 40A)'],
['IRF4905','MOSFET','TO-220','P-channel 55V 74A','1 Gate, 2 Drain, 3 Source','Shorted D-S.','STP80PF55, IRF5210 (higher voltage)'],
['SG3525','IC','DIP-16','PWM controller, supply 8 to 35V','1 INV in, 2 NI in, 3 Sync, 4 Osc out, 5 CT, 6 RT, 7 Discharge, 8 Soft-start, 9 Compensation, 10 Shutdown, 11 Output A, 12 GND, 13 Vc, 14 Output B, 15 Vcc, 16 Vref (5.1V)','No output pulses: check Vcc on pin 15, 5.1V on pin 16, and pin 10 must be low. Pins 11 and 14 should show square waves on a scope.','KA3525A, UC3525, SG3527'],
['TL494','IC','DIP-16','PWM controller, supply 7 to 40V','1 In1+, 2 In1-, 3 Feedback, 4 Dead-time, 5 CT, 6 RT, 7 GND, 8 C1, 9 E1, 10 E2, 11 C2, 12 Vcc, 13 Output ctrl, 14 Vref (5V), 15 In2-, 16 In2+','Check 5V on pin 14 and oscillator on pin 5. Pin 4 high stops the output.','KA7500, TL594, DBL494'],
['CD4047','IC','DIP-14','CMOS oscillator, 3 to 15V. Frequency about 1 / (4.4 x R x C)','Main pins: 1 C, 2 R, 3 RC common, 7 Vss (GND), 10 Q, 11 Q-bar, 13 Osc out, 14 Vdd. Check the full pinout in the datasheet','Used for 50Hz drive in small inverters. Check for 50Hz on pins 10 and 11 with a scope.','CD4047BE, HEF4047B, MC14047B'],
['IR2110','IC','DIP-14','High and low side MOSFET driver, 500V','1 LO, 2 COM, 3 Vcc, 5 Vs, 6 Vb, 7 HO, 9 Vdd, 10 HIN, 11 SD, 12 LIN, 13 Vss (pins 4, 8, 14 not connected)','Bootstrap diode and capacitor fail often. Check them first.','IR2113 (600V), IR2112'],
['IR2153','IC','DIP-8','Self-oscillating half-bridge driver, 600V','1 Vcc, 2 Rt, 3 Ct, 4 COM, 5 LO, 6 Vs, 7 HO, 8 Vb','Dead if Vcc zener or start-up resistor is open. Check supply on pin 1.','IR2153D (built-in diode), IR2155, IR2151'],
['LM358','IC','DIP-8','Dual op-amp, 3 to 32V','1 Out A, 2 In- A, 3 In+ A, 4 GND, 5 In+ B, 6 In- B, 7 Out B, 8 V+','Used for protection and feedback. Stuck output usually means the IC is dead.','LM2904, LM324 (quad, different pinout)'],
['NE555','IC','DIP-8','Timer, 4.5 to 16V','1 GND, 2 Trigger, 3 Output, 4 Reset, 5 Control, 6 Threshold, 7 Discharge, 8 Vcc','No output: check pin 4 is high and Vcc is present.','LM555, TLC555 (low power)'],
['TL431','IC','TO-92','Adjustable shunt reference, 2.5 to 36V','Reference, Anode, Cathode. Pin order differs by maker, check the datasheet','Used in feedback circuits. Wrong output voltage often means a failed TL431.','KA431, LM431'],
['PC817','IC','DIP-4','Optocoupler','1 Anode, 2 Cathode, 3 Emitter, 4 Collector','Test the LED side with a meter in diode mode. A dead optocoupler causes no regulation.','EL817, LTV-817, TLP521-1'],
['7805 / 7812','IC','TO-220','Fixed regulator 5V or 12V, up to 1A','Front view: 1 Input, 2 GND, 3 Output','Input must be at least 2V above output. Hot and no output means shorted load or dead part.','L7805/L7812, KA7805/KA7812, LM317 (adjustable)'],
['LM317','IC','TO-220','Adjustable regulator 1.25 to 37V, 1.5A','1 Adjust, 2 Output, 3 Input','Output voltage = 1.25 x (1 + R2/R1).','LM338 (5A), LM350 (3A)'],
['LM2596','IC','TO-263 / TO-220-5','Buck converter 3A, input up to 40V','1 Vin, 2 Output, 3 GND, 4 Feedback, 5 On/Off','Common in cheap buck modules. Check the inductor and diode too.','LM2576, or a ready buck module of same current'],
['BC547','Transistor','TO-92','NPN 45V 100mA','Flat side facing you, left to right: Collector, Base, Emitter','Test both junctions with a meter in diode mode.','BC337 (800mA), BC546, 2N3904 (pin order is E-B-C, different)'],
['TIP41C','Transistor','TO-220','NPN 100V 6A','1 Base, 2 Collector, 3 Emitter','Check for C-E short.','TIP31C, BD243C'],
['2N3055','Transistor','TO-3','NPN 60V 15A','Two pins: Base and Emitter. Case is the Collector','Common in old linear and older inverters. Check C-E short to case.','MJ15003, MJ15015, 2N3055H'],

['KBPC5010','Diode','Bridge','Bridge rectifier 1000V 50A','Two AC pins (~), one + and one - marked on the body','Test each of the 4 diodes. Needs a heatsink.','KBPC5010W, GBPC5010, KBPC3510 (35A, lower current)'],

['BT136','Other','TO-220','TRIAC 600V 4A','1 MT1, 2 MT2, 3 Gate','Shorted MT1-MT2 or no trigger.','BT137 (8A), BTA06-600, BTA08-600'],
['12V 30A relay (5 pin)','Other','Automotive','Coil 12V, contacts 30A or 40A','85 and 86 Coil, 30 Common, 87 Normally open, 87a Normally closed','Burnt contacts cause weak or no output. Check coil resistance, about 80 to 120 Ω.','Any 12V relay with same pinout and equal or higher contact current'],

let brainScore=0,brainIdx=0,brainDone=false;

function brainView(){
  const v=$('#vw');
  if(brainDone){
    v.innerHTML=`<div class="card"><h2>Brain Test Result</h2><p style="font-size:22px;font-weight:700;color:var(--ac)">${brainScore} / ${BRAIN.length}</p>
    <p class="sub">${brainScore>=8?'Excellent! You know your MOSFETs.':brainScore>=5?'Good effort. Review the explanations and try again.':'Keep learning – open the Components and Learn tabs.'}</p>
    <button id="brAgain">Try again</button></div>`;
    $('#brAgain').onclick=()=>{brainScore=0;brainIdx=0;brainDone=false;brainView()};
    return;
  }
  const q=BRAIN[brainIdx];
  v.innerHTML=`<div class="card"><div class="sub">Question ${brainIdx+1} of ${BRAIN.length}</div>
  <h2 style="margin:10px 0 14px;font-size:17px">${esc(q.q)}</h2>
  <div id="brOpts">${q.opts.map((o,i)=>`<button class="g" data-o="${i}" style="display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px">${esc(o)}</button>`).join('')}</div>
  <div id="brExp" class="res" style="display:none;margin-top:12px"></div>
  <button id="brNext" style="display:none;margin-top:10px">Next</button></div>`;
  v.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.o;
    const correct=i===q.a;
    if(correct)brainScore++;
    v.querySelectorAll('[data-o]').forEach(x=>{
      x.disabled=true;
      if(+x.dataset.o===q.a)x.style.background='var(--ac)';
      else if(+x.dataset.o===i)x.style.background='#d33';
    });
    const exp=$('#brExp');
    exp.style.display='block';
    exp.innerHTML=(correct?'✅ Correct. ':'❌ Not quite. ')+esc(q.exp);
    $('#brNext').style.display='inline-block';
  });
  $('#brNext').onclick=()=>{
    brainIdx++;
    if(brainIdx>=BRAIN.length)brainDone=true;
    brainView();
  };
}

let recStream=null,recMedia=null,recChunks=[],recTimer=null,recSecs=0;

function recordView(){
  const v=$('#vw');
  v.innerHTML=`<div class="card"><h2>Work Record</h2>
  <p class="sub">Record a short video of your repair or installation. The video stays on your phone – you can download it or share it later.</p>
  <video id="recPrev" playsinline muted style="width:100%;max-height:280px;background:#111;border-radius:14px;display:none"></video>
  <div id="recStatus" class="sub" style="margin:10px 0">Camera off</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <button id="recStart">Start camera</button>
    <button class="g" id="recRec" disabled>Record</button>
    <button class="g" id="recStop" disabled>Stop</button>
  </div>
  <div id="recResult" style="margin-top:14px"></div>
  <p class="sub" style="margin-top:12px">Tip: Record the board, the MOSFET leg, or the wiring so you can review or send to Cletus later.</p></div>`;

  const prev=$('#recPrev'), st=$('#recStatus'), res=$('#recResult');
  $('#recStart').onclick=async()=>{
    try{
      if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null}
      recStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:true});
      prev.srcObject=recStream;prev.style.display='block';prev.play();
      st.textContent='Camera ready – point at the work';
      $('#recRec').disabled=false;
    }catch(e){st.textContent='Camera permission denied or not available. Allow camera in browser settings.'}
  };
  $('#recRec').onclick=()=>{
    if(!recStream)return;
    recChunks=[];recSecs=0;
    recMedia=new MediaRecorder(recStream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});
    recMedia.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    recMedia.onstop=()=>{
      clearInterval(recTimer);
      const blob=new Blob(recChunks,{type:'video/webm'});
      const url=URL.createObjectURL(blob);
      res.innerHTML=`<p><b>Recording saved locally</b> (${recSecs}s)</p>
        <video src="${url}" controls style="width:100%;border-radius:12px;margin:8px 0"></video>
        <a class="btn" href="${url}" download="cletuson-work-${Date.now()}.webm">Download video</a>`;
      st.textContent='Recording finished';
      $('#recRec').disabled=false;$('#recStop').disabled=true;
    };
    recMedia.start(200);
    $('#recRec').disabled=true;$('#recStop').disabled=false;
    st.textContent='Recording… 0s';
    recTimer=setInterval(()=>{recSecs++;st.textContent='Recording… '+recSecs+'s'},1000);
  };
  $('#recStop').onclick=()=>{if(recMedia&&recMedia.state==='recording')recMedia.stop()};
}

const LRN=[{t:'Safety and test method',i:[['Before you start','Disconnect the battery and mains. Discharge any high-voltage capacitor through a resistor. After a repair, connect the battery through a car bulb in series: a bright bulb means a short, a dim bulb means normal.']]},
{t:'Inverter troubleshooting',i:[['Dead, no lights or display','Causes: blown DC fuse, loose or corroded battery terminal, dead battery, failed switch, dead 12V or 5V regulator. Check: battery voltage at the board, fuse continuity, supply on the control IC (SG3525 pin 15, TL494 pin 12).'],['Fuse blows as soon as the battery connects','Causes: shorted MOSFET, reversed battery polarity damage, shorted capacitor or diode. Check: drain-source of every MOSFET with a meter. Remove them one by one to find the shorted one.'],['Powers on but no AC output','Causes: no gate drive, open driver stage, open transformer winding, relay not closing, latched protection. Check: PWM waveform at the control IC outputs and at the gates, then the relay and transformer.'],['Overload light or trips on load','Causes: weak battery sagging, load too large, shorted transformer secondary, faulty current-sense circuit (shunt, LM358 or LM393). Check: battery voltage under load and the sense resistor.'],['Low output voltage','Causes: weak battery, loose battery cable, one dead MOSFET side, bad feedback pot or optocoupler, aged electrolytic capacitors. Check: both push-pull sides give equal pulses.'],['High output voltage','Causes: broken feedback loop, open feedback resistor, failed TL431 or optocoupler, pot turned wrong. Check: the feedback resistors and the reference.'],['MOSFETs burn again and again','Causes: wrong or unmatched replacements, open gate resistor, failed gate zener, bad driver IC, no dead time, loose battery cable, poor heatsink paste. Replace all MOSFETs on the side, then check gate waveforms before load.'],['Transformer buzzes or runs hot','Causes: overload, unbalanced drive causing DC offset, shorted turns, wrong frequency. Check: output frequency (50 or 60 Hz) and drive symmetry.'],['Beeps continuously','Causes: low battery, overload, over-temperature, loose sense wiring. Read the indicator pattern in the manual, then test the matching circuit.'],['Does not charge from mains','Causes: blown AC fuse, burnt changeover relay, open bridge rectifier, failed charge MOSFET or triac. Check: AC fuse, relay contacts, charger rectifier.'],['Short backup time','Causes: old battery, low water in flooded cells, sulphation, thin cable, load higher than expected. Check: battery voltage under load and each cell, and the real load in watts.'],['Runs hot or fan always on','Causes: overload, dusty heatsink, failed fan, dry thermal paste, a weak MOSFET. Check: heatsink contact, fan, and load.']]},
{t:'Types of inverters',i:[['Square wave','Cheapest. Harsh output. Fine only for simple loads like bulbs and heaters. Can damage motors and sensitive electronics.'],['Modified sine wave','Stepped waveform. Works for lights, TVs and fans (may hum). Poor for some motors, chargers and medical equipment.'],['Pure sine wave','Clean output like the mains. Safe for all loads, including fridges, computers and motors.'],['Low-frequency (iron transformer)','Heavy and rugged. Handles surge and motor loads well. Easier to repair.'],['High-frequency (SMPS)','Light and efficient. Lower surge capacity and more complex to repair.'],['Off-grid, grid-tie and hybrid','Off-grid runs from battery or solar only. Grid-tie feeds the utility and shuts down in an outage. Hybrid does both with a battery.'],['Inverter-charger and UPS','Charges the battery from mains and switches over in an outage. UPS types: offline, line-interactive and online double-conversion.'],['Solar inverter and charge controller','PWM controllers are cheaper. MPPT controllers harvest more from the panels.'],['Single-phase and three-phase','Single-phase suits homes and small shops. Three-phase suits heavy motors and large sites.']]},
{t:'Types of batteries',i:[['Flooded tubular lead-acid','Most common inverter battery. Needs distilled water top-ups. Use about 50% depth of discharge. Roughly 1000 to 1500 cycles.'],['Flat-plate (car) battery','Built for starting engines, not deep cycles. Wears out fast on an inverter.'],['AGM (sealed lead-acid)','No top-ups. Handles high current. Sensitive to overcharge.'],['Gel','Good for deep cycling and heat. Charges slowly. Needs the correct charge voltage.'],['LiFePO4 (lithium iron phosphate)','Light. About 80 to 90% usable. Thousands of cycles. Needs a BMS and a charger set for lithium. Higher cost.'],['Li-ion (NMC or 18650 packs)','High energy in a small size. Needs a BMS. Fire risk if abused.'],['Series and parallel','Series adds voltage (two 12V = 24V). Parallel adds Ah. Use batteries of the same type, age and Ah.'],['Quick voltage check (lead-acid 12V, resting)','About 12.7V is full. About 12.2V is half. Typical charge: about 14.4V absorption and about 13.6V float. Check the maker datasheet.']]},
{t:'Types of resistors',i:[['Reading colour bands','Black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. Four bands: two digits, multiplier, tolerance. Five bands: three digits, multiplier, tolerance. Gold 5%, silver 10%.'],['Carbon film','Cheap, general use, 5% tolerance. Good for pull-ups and general circuits.'],['Metal film','1% or better, low noise, stable. Use for feedback and voltage dividers.'],['Metal oxide','Handles heat and surges better than carbon film. Common in power supplies.'],['Wire-wound and cement','Power resistors from about 5W up. Used for loads, bleeders and shunts. Run hot.'],['Fusible resistor','Opens safely on overload, like a fuse. Replace with the same value and wattage.'],['SMD (chip)','Three digits: 103 = 10 kΩ. R is the decimal point: 4R7 = 4.7 Ω.'],['Variable (pot and trimmer)','Sets voltage, frequency or trip level. Worn tracks cause unstable output.'],['Thermistor (NTC and PTC)','NTC drops in resistance when hot, used for inrush limiting. PTC rises when hot, used as resettable protection.'],['Shunt resistor','Very low value, used to sense current. Check it when overload protection misbehaves.']]},
{t:'Types of relays',i:[['Electromechanical relay','A coil magnet moves the contacts. Match the coil voltage and contact current. Burnt contacts cause weak or no output.'],['NO, NC and changeover','Normally open closes when powered. Normally closed opens when powered. Changeover (SPDT) has one common that switches between two. Inverters use one to swap between mains and inverter.'],['Solid-state relay (SSR)','No moving parts, silent. Needs a heatsink on large loads. Usually fails shorted.'],['Reed and latching relay','Reed relays suit small signals. A latching relay holds its position without coil power.']]},
{t:'Types of inductors',i:[['Air-core','Low inductance, never saturates. Used at high frequency.'],['Ferrite and toroid','Used in SMPS and filters. Saturates if overloaded, so replace with the same inductance and current rating.'],['Iron-core choke','Heavy. Used for mains-frequency filtering.'],['Common-mode choke','Two windings on one core. Blocks noise on the AC input line.'],['Testing','Use an LCR meter. Look for open or shorted turns and burnt insulation.']]},
{t:'Types of LEDs',i:[['Indicator LED (3 mm, 5 mm)','About 2V forward for red, about 3V for blue and white. Resistor = (supply - LED voltage) / current. Use about 10 to 20 mA.'],['Power LED and SMD LED','1W and above need a heatsink and a current driver, not just a resistor.'],['Bi-colour and RGB','RGB types are common anode or common cathode. Match the wiring.'],['Testing','Meter in diode mode lights a good LED dimly. Use a phone camera to see infrared LEDs.']]},
{t:'Types of zener diodes',i:[['Standard zener','Holds a fixed voltage in reverse. Sizes 0.5W, 1W and 5W. Common values 3.3, 5.1, 12, 15 and 18V.'],['Gate protection zener','15 to 18V across gate and source protects a MOSFET. A shorted zener kills the gate drive.'],['TVS diode','Clamps surges faster than a MOV. Protects inputs from spikes.'],['Testing','Forward drop is like a normal diode. To test the zener voltage, feed it through a resistor from a supply and measure across it.']]},
{t:'Types of diodes',i:[['Rectifier (1N400x, 1N540x)','Mains-frequency use. Slow, so never use in high-frequency stages.'],['Fast and ultrafast (FR, UF, MUR)','For inverter and SMPS switching stages. Do not swap with a plain rectifier.'],['Schottky','Low forward drop, low voltage. Fails shorted on overvoltage.'],['Signal diode (1N4148)','Small, fast. Used in logic and protection circuits.'],['Bridge rectifier','Four diodes in one body. Test each pair.'],['Testing','Silicon about 0.5 to 0.7V forward, Schottky about 0.2 to 0.4V, and OL in reverse.']]},
{t:'Types of capacitors',i:[['Electrolytic','Polarised, large values. Bulging or leaking means failed. Use low-ESR types in inverters.'],['Ceramic','No polarity. Code 104 = 100 nF. X7R is stable, Y5V is poor.'],['Film (polyester, polypropylene)','Stable. X2 and Y2 types are used across the mains line.'],['Tantalum','Polarised and compact. Fails shorted. The stripe marks positive.'],['Supercapacitor','Farads of capacity at low voltage. Used for backup.'],['Testing','Discharge first. Use a capacitance or ESR meter. A reading does not prove it is healthy under load.']]},
{t:'Types of transformers',i:[['Iron-core (low frequency)','Main inverter transformer. Heavy and rugged. Rated in VA with a low-voltage centre-tapped primary.'],['Ferrite (high frequency)','Used in SMPS inverters. Do not rewind without exact data.'],['Toroidal','Efficient, quiet, compact. Common in good quality inverters.'],['Autotransformer','One winding with taps. Used in stabilisers.'],['Current transformer','Measures AC current. Never leave its secondary open.'],['Testing','Check winding resistance, insulation to the core, and look for burns or smell.']]},
{t:'Types of IGBTs',i:[['What it is','A switch with a MOSFET-style gate and a bipolar output. Pins: Gate, Collector, Emitter.'],['IGBT or MOSFET','MOSFETs suit low voltage and high frequency. IGBTs suit high voltage and high power at lower frequency.'],['Discrete and modules','Discrete parts come in TO-247. Modules hold half-bridges or six switches and need a proper driver.'],['Replacing','Match voltage, current, speed class and the built-in diode. Test for C-E short and gate leakage.']]},
{t:'MOSFET channel types',i:[['N-channel','Turns on with a positive gate voltage above the source. Most common switch.'],['P-channel','Turns on with a negative gate voltage below the source. Used on the high side, but higher resistance.'],['Enhancement and depletion','Enhancement is off at 0V gate (most MOSFETs). Depletion is on at 0V.'],['Logic-level','Fully on with about 5V gate. Standard types need about 10V.'],['JFET','N or P channel. Used in amplifiers and low-noise circuits.']]},
{t:'Types of MOSFETs',i:[['Power MOSFET','TO-220 and TO-247. The main inverter switch. Read Vds, Id, Rds(on), Vgs(th) and gate charge.'],['SMD MOSFET','Used on small boards. Check the heat path.'],['Dual MOSFET','Two switches in one package, used as half-bridges.'],['SiC MOSFET','High efficiency, high voltage and temperature. Costly.'],['Replacing','Match type, voltage, current and Rds(on). Replace all on the same side together.']]},
{t:'Types of meters',i:[['Digital multimeter','Voltage, resistance, continuity, diode test and capacitance. Use true-RMS for inverter output.'],['Clamp meter','Reads current without breaking the circuit. Use a DC clamp for battery current.'],['Analogue meter','Shows trends and fluctuations well.'],['LCR and ESR meter','Tests inductors and capacitors.'],['Oscilloscope','Shows PWM, gate waveforms and output shape.'],['Insulation tester and wattmeter','Checks insulation and measures real power drawn.']]},
{t:'Types of temperature sensors',i:[['NTC thermistor','Resistance falls when hot. Common on heatsinks to run the fan or trip protection.'],['LM35','Analogue output of 10 mV per degree C.'],['DS18B20','Digital sensor, usable on one wire.'],['Thermocouple (K-type)','For high temperatures. Needs an amplifier.'],['Thermal switch (KSD301)','Opens at a set temperature. Protects transformers and heatsinks.']]},
{t:'Types of current sensors',i:[['Shunt resistor','Very low resistance. Voltage across it shows the current.'],['Hall effect (ACS712, LEM)','Isolated. ACS712 comes in 5A, 20A and 30A and outputs about 2.5V at zero current on 5V supply.'],['Current transformer','AC only. Isolated and simple.'],['Clamp','Uses a Hall or CT inside a clamp for measuring on a wire.']]},
{t:'Types of jumpers',i:[['Jumper wire','Breadboard wires: male-male, male-female or female-female.'],['Jumper shunt (pin header)','A small cap over two pins. Sets a mode or address on a board.'],['Zero-ohm link','A 0 Ω resistor or wire link on a PCB. A broken link causes no output.'],['Battery jumper cable','Heavy cable for jump starting. Not the same as inverter battery cables.']]},
{t:'Other components',i:[['Fuse','Glass, blade, ANL or MIDI. Use a DC-rated fuse on battery lines.'],['Circuit breaker','MCB for AC, DC-rated breaker for battery side.'],['Switch','Toggle, rocker or push. Check the current and voltage rating.'],['Optocoupler','LED and phototransistor in one. Isolates the feedback and control side.'],['SCR','Latches on after a gate pulse. Used in chargers and crowbar protection.'],['TRIAC','AC switch with a gate. Used in dimmers and chargers.'],['Voltage regulator','78xx fixed, LM317 adjustable, buck modules for efficiency.'],['Op-amp','Amplifier used in feedback and sensing. LM358, LM324, TL082.'],['Comparator','Compares two voltages. LM393 is common in protections.'],['Crystal oscillator','Gives an accurate clock for microcontroller SPWM boards.'],['MOV (varistor)','Clamps mains surges. Replace if it shows damage.'],['Heatsink','Aluminium block that cools MOSFETs. Use good paste and insulators.'],['Cooling fan','Runs from a temperature sensor. A dead fan causes overheating.'],['Buzzer','Active (has an internal oscillator) or passive (needs a signal).'],['Terminal block and lugs','Joins cables to boards and batteries. Loose lugs cause heat and voltage drops.'],['Cables and wire','Stranded copper for batteries. Use the correct mm2 size for the current.'],['Microcontroller','PIC, ATmega or STM32 can generate SPWM and handle protections.'],['SPWM driver chip (EG8010)','Generates the sine wave drive. Works with a driver board such as IR2110.'],['Display','LCD, LED or 7-segment. Shows voltage, load and battery status.'],['Thermal paste and pads','Moves heat from MOSFET to heatsink. Dry paste causes overheating.']]}];
